# Instalação independente. Não reutiliza o banco/volumes do compose de desenvolvimento.
name: contraponto

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: contraponto
      POSTGRES_DB: contraponto
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Execute scripts/install.sh para gerar a configuração}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U contraponto -d contraponto']
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: .
    restart: unless-stopped
    user: '0:0'
    environment:
      APP_ENV: installation
      DATABASE_URL: postgresql://contraponto:${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}@db:5432/contraponto
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET}
      JWT_ALGORITHM: HS256
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Preencha OPENAI_API_KEY em .env.install}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OPENAI_MODEL_NAME: ${OPENAI_MODEL_NAME:-}
      DEEPINFRA_API_KEY: ${DEEPINFRA_API_KEY:-}
      DEEPINFRA_MODEL: ${DEEPINFRA_MODEL:-}
      OPENAI_EMBEDDING_MODEL: text-embedding-3-small
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      INDEX_DOWNLOAD_URL: ${INDEX_DOWNLOAD_URL:-https://drive.google.com/uc?id=1Uf2UyfctklI1kzE6k1j927m0yiFyucSc}
      INDEX_SHA256: ${INDEX_SHA256:-}
      BACKEND_UID: '10001'
      BACKEND_GID: '10001'
      MSB_HOME: /app/microsandbox
    volumes:
      - workdirs:/app/workdirs
      - search_index:/app/graph/tools/retrieval/indice
      - microsandbox:/app/microsandbox
      - backend_tmp:/tmp
    devices:
      - /dev/kvm:/dev/kvm
    read_only: true
    tmpfs:
      - /run:rw,noexec,nosuid,nodev,size=16m
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    init: true
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      start_period: 10m
      interval: 10s
      timeout: 5s
      retries: 6

  frontend:
    build:
      context: ../front-end
      target: production
    restart: unless-stopped
    ports:
      - '${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-5173}:8080'
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/health]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  postgres_data:
  workdirs:
  search_index:
  microsandbox:
  backend_tmp:
