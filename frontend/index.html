<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ateliê de agentes</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand-mark">A</div>
        <div>
          <p class="eyebrow">ATELIÊ DE AGENTES</p>
          <h1>Transforme uma ideia em uma atividade</h1>
        </div>
        <button class="new-session" id="new-session" type="button">Nova sessão</button>
      </header>

      <section class="progress" aria-label="Etapas do fluxo">
        <div class="progress-step active" data-step="0"><span>1</span><strong>Brainstorm</strong></div>
        <div class="progress-line"></div>
        <div class="progress-step" data-step="1"><span>2</span><strong>Especificação</strong></div>
        <div class="progress-line"></div>
        <div class="progress-step" data-step="2"><span>3</span><strong>Agente final</strong></div>
      </section>

      <section class="workspace">
        <div class="main-card">
          <div class="step-copy" id="step-copy"></div>
          <div id="step-content"></div>
          <p class="error-message" id="error-message" role="alert"></p>
        </div>

        <aside class="preview-card" id="html-preview-card" hidden>
          <div class="preview-heading">
            <div>
              <p class="eyebrow">DOCUMENTO ATUAL</p>
              <h2>HTML.html</h2>
            </div>
            <a id="html-open-link" href="#" target="_blank" rel="noopener">Abrir</a>
          </div>
          <iframe id="html-preview" title="Pré-visualização do HTML gerado"></iframe>
          <div class="html-edit-panel" id="html-edit-panel" hidden>
            <p class="selected-html-target">Melhorias selecionadas</p>
            <p id="selected-html-target"></p>
            <textarea id="html-edit-input" placeholder="Escreva o que você quer melhorar nesta seção..."></textarea>
            <div class="attachment-row"><button class="clip-button" id="html-attach-button" type="button" title="Anexar arquivo">📎</button><span id="html-file-name"></span><input id="html-file-input" type="file" hidden /></div>
            <button class="primary-button" id="html-edit-submit" type="button">Enviar todas as melhorias ↑</button>
          </div>
        </aside>

      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
